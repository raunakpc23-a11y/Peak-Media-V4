      <!-- A -->
      <path d="M618 282 H648 L698 402 H663 L652 374 H612 L601 402 H566 Z
               M621 348 H643 L632 316 Z" fill-rule="evenodd"/>
    </g>

    <!-- Shadow fill for left slope -->
