      <!-- A -->
      <path d="M438 130 H468 L520 250 H484 L473 222 H432 L421 250 H385 Z
               M441 196 H464 L452.5 164 Z" fill-rule="evenodd"/>
      <!-- K -->
      <path d="M538 130 H572 V182 L626 130 H668 L608 186 L672 250 H628 L572 194 V250 H538 Z"/>
      <!-- M -->
      <path d="M135 282 H172 L196.5 344 L221 282 H258 V402 H227 V334
               L203 392 H190 L166 334 V402 H135 Z"/>
      <!-- E -->
      <path d="M278 282 H368 V308 H311 V329 H358 V354 H311 V376 H368 V402 H278 Z"/>
      <!-- D -->
