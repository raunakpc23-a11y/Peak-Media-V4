<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 760" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#071022"/>
      <stop offset="55%"  stop-color="#050811"/>
      <stop offset="100%" stop-color="#081832"/>
    </linearGradient>
    <linearGradient id="skyMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#F0F9FF"/>
      <stop offset="30%"  stop-color="#7DD3FC"/>
      <stop offset="65%"  stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="skySun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#7DD3FC" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="14" y="14" width="732" height="732" rx="164"
        fill="url(#bg)" stroke="#38BDF8" stroke-opacity="0.55" stroke-width="14"/>

  <!-- Glow halo -->
  <circle cx="462" cy="240" r="220" fill="#38BDF8" fill-opacity="0.14"/>

