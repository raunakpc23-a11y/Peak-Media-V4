    <!-- Glow fill for right slope -->
    <polygon points="482,56 516,118 558,188 610,256 674,328 736,362 612,332 518,286 485,142"
             fill="url(#skySun)"/>

    <!-- Peak ridge lines -->
    <g stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M78 356 L195 304 L288 248 L385 186 L435 126 L468 82 L482 56"
